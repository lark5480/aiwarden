spring:
  application:
    name: aiwarden
  # 虚拟线程 WebMVC（ADR-002）：LLM 长阻塞 IO 的标准承载方式
  threads:
    virtual:
      enabled: true
  # 数据层：默认指向 docker compose 起的 PostgreSQL（pgvector），可用环境变量覆盖
  datasource:
    url: ${AIWARDEN_DB_URL:jdbc:postgresql://localhost:5432/aiwarden}
    username: ${AIWARDEN_DB_USER:aiwarden}
    password: ${AIWARDEN_DB_PASSWORD:aiwarden}
  # 迁移：启动时自动执行 src/main/resources/db/migration（PRD §7.1 迁移=Flyway）
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Redis：配额预扣减 / 租户限流（ADR-010；与 docker-compose 的 redis 容器对齐）
  data:
    redis:
      host: ${AIWARDEN_REDIS_HOST:localhost}
      port: ${AIWARDEN_REDIS_PORT:6379}

# 运维面：Prometheus 指标端点（含 aiwarden_vector_orphan_total / aiwarden_ingest_stuck_total）
# Trace（M4 / FR-OBS）：OTLP → docker compose 的 otel-collector → Tempo；采样率演示环境取 1.0。
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  tracing:
    sampling:
      probability: ${AIWARDEN_TRACE_SAMPLE_PROBABILITY:1.0}
    export:
      otlp:
        # 演示默认不导出：本机没有 collector 时避免每个 batch 刷连接错误；
        # 起好 OTel Collector / Tempo 后设 AIWARDEN_TRACE_EXPORT_ENABLED=true（见 STATUS §3）。
        enabled: ${AIWARDEN_TRACE_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${AIWARDEN_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false   # 指标仍走 Prometheus 端点；避免同一批指标双写 OTLP

# P3 工具治理（FR-PERM-03 / ADR-009）：装配期定死的会话级可见面白名单——
# 不在名单内的工具不可见、不可调用（显式禁 web_search/web_fetch 在 ToolWhitelist 代码层）
aiwarden:
  agent:
    tools:
      allowed: create_ticket,assign_ticket
    tool-invocation:
      processing-lease-seconds: 300   # PROCESSING 超租约可 CAS 重抢（「不确定可重试」）
    # P5 断点续跑（M4 / FR-CKPT）：执行实例租约；崩溃实例的租约过期后由续跑实例接管。
    # crash-before-checkpoint 是**测试专用**崩溃注入点（匹配节点名 → 该节点动作完成后、
    # checkpoint 提交前 Runtime.halt(137)），生产配置必须留空。
    checkpoint:
      lease-seconds: 60
      crash-before-checkpoint: ""
  # 问答编排（M3 / ADR-012）：模型通道缺省 mock（确定性替身；真实适配器接入后切换）
  chat:
    model: mock
    top-k: 5
    cost:
      prompt-per-1k: 0.002        # 演示单价（元/千 token；真实价目表接入后替换）
      completion-per-1k: 0.006
  # 配额/限流默认值均在组件 @Value 内（tool-token-cost=100、reserve-ttl=72h、限流 60s/1000 次）；
  # 未配置预算 = 不启用配额检查（ADR-010 决策 7）
